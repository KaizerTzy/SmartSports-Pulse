name: Build

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartsports-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smartsports-pulse/package-lock.json
      - run: npm ci
      - run: npm run build
